<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Project - Maintenance</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f5; color: #111827; }
    main { width: min(560px, calc(100% - 32px)); padding: 48px; background: white; border: 1px solid #dfe5df; border-radius: 8px; box-shadow: 0 18px 50px rgba(17, 24, 39, .08); }
    .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; background: #76b900; color: #fff; font-weight: 800; }
    h1 { margin: 24px 0 10px; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; letter-spacing: 0; }
    p { margin: 0; color: #5d6875; font-size: 17px; line-height: 1.6; }
    a { display: inline-flex; margin-top: 24px; color: #315b00; font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <h1>Inventory is under maintenance.</h1>
    <p>The service is temporarily unavailable while scheduled work is completed. Please try again shortly.</p>
    <a href="/admin?tab=health">Privileged Administrator access</a>
  </main>
</body>
</html>
